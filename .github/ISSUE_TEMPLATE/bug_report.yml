name: 🐛 Bug Report
description: Report a bug or issue with OpenVisionKit
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.
        
        **Before submitting**: Please search existing issues to avoid duplicates.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please verify these items before submitting
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have read the [Contributing Guidelines](https://github.com/ultrasardine/OpenVisionKit/blob/main/CONTRIBUTING.md)
          required: true
        - label: This is not a security vulnerability (use [Security Policy](https://github.com/ultrasardine/OpenVisionKit/blob/main/SECURITY.md) instead)
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - Windows 10
        - Windows 11
        - Ubuntu 18.04
        - Ubuntu 20.04
        - Ubuntu 22.04
        - Other Linux (specify in description)
        - macOS 10.15 (Catalina)
        - macOS 11 (Big Sur)
        - macOS 12 (Monterey)
        - macOS 13 (Ventura)
        - macOS 14 (Sonoma)
        - Other (specify in description)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenVisionKit Version
      description: Which version of OpenVisionKit are you using?
      placeholder: "e.g., v1.0.0, main branch commit hash"
    validations:
      required: true

  - type: input
    id: obs_version
    attributes:
      label: OBS Studio Version (if applicable)
      description: If using the OBS plugin, what version of OBS Studio?
      placeholder: "e.g., 29.1.3"

  - type: textarea
    id: system_specs
    attributes:
      label: System Specifications
      description: Provide your system specifications
      placeholder: |
        - CPU: Intel i7-10700K / AMD Ryzen 7 3700X
        - GPU: NVIDIA RTX 3070 / AMD RX 6700 XT
        - RAM: 16GB DDR4
        - Graphics Driver: NVIDIA 516.94 / AMD 22.5.1
      value: |
        - CPU: 
        - GPU: 
        - RAM: 
        - Graphics Driver: 
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe what happened and what you expected to happen
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue
      placeholder: |
        1. Open OBS Studio
        2. Add a video source
        3. Apply OpenVisionKit Stabilization filter
        4. Configure settings: ...
        5. Start streaming/recording
        6. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened
    validations:
      required: true

  - type: input
    id: obs_log
    attributes:
      label: OBS Studio Log (if applicable)
      description: Upload your OBS log file (Help → Log Files → Upload Current Log File)
      placeholder: "https://obsproject.com/logs/..."

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: |
        Any additional information that might be helpful:
        - Screenshots or videos demonstrating the issue
        - Error messages or console output
        - Configuration files
        - Workarounds you've tried
      placeholder: Add any other context about the problem here

  - type: checkboxes
    id: terms
    attributes:
      label: Submission Agreement
      description: By submitting this issue, you agree to our terms
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/ultrasardine/OpenVisionKit/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: I understand this is a community-maintained project and response times may vary
          required: true